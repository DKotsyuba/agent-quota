# Claude subscription login. On native Linux, refresh_oauth lets the pinned Claude CLI renew the
# OAuth login (one isolated tiny haiku turn, at most six per day) when it is within
# five minutes of expiry and a collection is due; omit it to only report
# credential_expired.
# [[sources]]
# account = "account-claude"
# provider = "claude"
# auth_family = "anthropic"
# credential = "named:claude-code:LABEL"
# app_home = "/ABSOLUTE/PATH/TO/.agent-run"
# models = [{ id = "replace-with-configured-model" }]
#
# [sources.harness]
# id = "claude-code"
# binary = "/ABSOLUTE/PATH/TO/CLAUDE"
# home = "/ABSOLUTE/PATH/TO/.agent-run/service-runtime/claude"
# refresh_oauth = true
#
# [sources.collector]
# command = "/bin/bash"
# args = ["/ABSOLUTE/PRIVATE/PARENT/quota-assets/collectors/claude.sh"]
# source = "claude-oauth-usage"
# timeout_seconds = 30
#
# Optional, only with execution = "external": let an authorized owner redeem a
# banked reset credit (docs/configuration.md#reset-credit-redemption).
# [sources.redeem]
# command = "/bin/bash"
# args = ["/ABSOLUTE/PRIVATE/PARENT/quota-assets/collectors/claude-redeem.sh"]
# instance = "LAUNCHER-INSTANCE"

# Optional capacity ranking weights (defaults 1.0; see docs/configuration.md):
# put `priority_multiplier = 2.0` inside a [[sources]] entry for an account weight, and
# [providers.codex]
# priority_multiplier = 1.0
# ordered_accounts = false

# For an unobserved account, use limits_source = "none" and omit the collector.
# For a separate credential-owning UID, use execution = "external" and the
# probe/ingest procedure in docs/api.md; no credential is read by the service.
